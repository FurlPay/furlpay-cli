name: Docs

# Live documentation site (VitePress) → GitHub Pages.
# Site lives in docs-site/, builds to docs-site/.vitepress/dist and is
# pushed to the gh-pages branch, which the Pages config serves from
# (build_type: legacy, source: gh-pages). This branch-push flow works
# regardless of the org's Actions/Pages build mode.
# Live at: https://furlpay.github.io/furlpay-cli/

on:
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Build docs site
        run: |
          npm ci
          npm run docs:build
      - name: Push built site to gh-pages
        working-directory: docs-site/.vitepress/dist
        run: |
          touch .nojekyll
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: deploy VitePress site build of ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
      - name: Request Pages build
        run: |
          # Legacy-mode Pages picks the push up automatically; this explicit
          # trigger just removes the race if the webhook is slow.
          sleep 5
          curl -sf -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds" > /dev/null || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
